env:
  contexts:
    - name: meditrack
      urls:
        - http://localhost:8081
      includePaths:
        - http://localhost:8081.*
  parameters:
    failOnError: true
    progressToStdout: true

jobs:
  - type: replacer
    parameters:
      deleteAllRules: true
    rules:
      - description: auth-header
        matchType: req_header
        matchString: Authorization
        matchRegex: false
        replacementString: "Basic AUTH_PLACEHOLDER"

  - type: requestor
    requests:
      - url: http://localhost:8081/api/me/dossier
        method: GET
      - url: http://localhost:8081/api/me/dossiers/1
        method: GET
      - url: http://localhost:8081/api/me/recherche?nom=test
        method: GET
      - url: http://localhost:8081/actuator/env
        method: GET
      - url: http://localhost:8081/api/me/document?nom=test.txt
        method: GET
      - url: http://localhost:8081/actuator/mappings
        method: GET

  - type: spider
    parameters:
      context: meditrack
      maxDuration: 1

  - type: passiveScan-wait
    parameters:
      maxDuration: 3

  - type: activeScan
    parameters:
      context: meditrack
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 8

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: zap-report