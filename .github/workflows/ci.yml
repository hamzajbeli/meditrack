name: CI DevSecOps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build et tests (Maven)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: meditrack
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d meditrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/meditrack
      SPRING_DATASOURCE_USERNAME: ci_user
      SPRING_DATASOURCE_PASSWORD: ci_password_demo
      DB_HOST: localhost
      DB_USER: ci_user
      DB_PASSWORD: ci_password_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify

  trivy:
    name: Trivy (dépendances et image Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan du dépôt (dépendances et configuration)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Build de l'image
        run: docker build -t meditrack:${{ github.sha }} .
      - name: Scan de l'image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: meditrack:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'